<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pairwatch</title>
<style>
  :root {
    --bg: #0b1120; --card: #111a2e; --card2: #0e1627; --line: #1e2a42; --text: #e2e8f0; --soft: #cbd5e1;
    --dim: #8b9ab3; --faint: #64748b; --accent: #e07a5f; --st: #a78bfa; --ok: #4ade80; --bad: #f87171;
    --code-bg: #0a1222; --btn: #17233b; --btn-hover: #1f2e4d; --shadow: 0 1px 0 rgba(255,255,255,.03) inset;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f5f7fb; --card: #ffffff; --card2: #f8fafc; --line: #e2e8f0; --text: #0f172a; --soft: #334155;
      --dim: #5b6b86; --faint: #94a3b8; --code-bg: #eef2f7; --btn: #eef2f8; --btn-hover: #e2e8f3; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 14px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif; padding: 12px 16px 72px; }
  .wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--faint); box-shadow: 0 0 0 3px rgba(100,116,139,.18); }
  .brand .dot.live { background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.18); animation: pulse 2s infinite; }
  @keyframes pulse { 50% { box-shadow: 0 0 0 6px rgba(74,222,128,.05); } }
  .meta { color: var(--dim); font-size: 12.5px; flex: 1; min-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  select, button { font: inherit; color: var(--text); background: var(--btn); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  select { padding-right: 8px; max-width: 100%; }
  button:hover, select:hover { background: var(--btn-hover); }
  button:active { transform: translateY(1px); }
  button.flash { border-color: var(--accent); }
  button[disabled], select[disabled] { opacity: .45; cursor: default; }
  button[disabled]:active { transform: none; }
  #stage { border-radius: 14px; overflow: hidden; line-height: 0; min-height: 60px; background: #0c1424; }
  #stage svg { width: 100%; height: auto; display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); }
  .now { border-left: 4px solid var(--st); }
  .now p:first-child { font-size: 15.5px; }
  .src { float: right; font-size: 11px; color: var(--faint); margin-left: 8px; }
  .lesson { background: var(--card2); border-left: 4px solid #facc15; }
  .ask { border-left: 4px solid var(--accent); }
  .ended { border-left: 4px solid var(--faint); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .soft { color: var(--dim); font-size: 13px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(6px); border-top: 1px solid var(--line); }
  .bar .row { max-width: 860px; margin: 0 auto; }
  .spacer { flex: 1; }
  p { margin: 0 0 8px; } p:last-child { margin-bottom: 0; }
  ul { margin: 4px 0 8px; padding-left: 20px; }
  blockquote { margin: 6px 0; padding: 4px 12px; border-left: 3px solid var(--line); color: var(--soft); }
  code { font: 12.5px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; word-break: break-word; }
  strong { color: var(--text); }
  a { color: #7dd3fc; }
  .empty { text-align: center; padding: 40px 16px; color: var(--dim); }
  .empty h2 { color: var(--text); font-size: 18px; margin: 0 0 8px; }
  .hidden { display: none !important; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--st); display: inline-block; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span id="dot" class="dot"></span>Pairwatch</div>
    <div class="meta" id="meta">connecting…</div>
    <select id="session" class="hidden" title="Session"></select>
  </header>

  <div id="empty" class="card empty hidden">
    <h2>Waiting for Claude…</h2>
    <p>This page shows what a Claude Code session is doing, live, with a lesson for each step.</p>
    <p class="soft">It fills in as soon as a session with Pairwatch starts working. Type <code>/pairwatch</code> in Claude Code to switch it on.</p>
  </div>

  <div id="live" class="hidden">
    <div class="wrap">
      <div id="ended" class="card ended hidden" role="status"><strong>This session ended</strong><span id="ended-next" class="soft"></span></div>
      <div id="stage" role="img" aria-label=""></div>
      <div id="now" class="card now"></div>
      <div id="ask" class="card ask hidden"></div>
      <div id="lesson" class="card lesson hidden"></div>
      <div id="context" class="soft"></div>
      <div id="note" class="soft hidden"></div>
    </div>
  </div>
</div>

<div class="bar">
  <div class="row">
    <button id="b-why" title="Ask Claude itself what it is doing and why (w)">🤔 Why?</button>
    <button id="b-tip" title="Show another concept card (t)">💡 Another tip</button>
    <button id="b-known" title="Retire this card (k)">✓ I know this</button>
    <button id="b-pause" title="Pause or resume Pairwatch (p)">⏸ Pause</button>
    <span class="spacer"></span>
    <span class="chip" id="chip"><i></i><span id="chip-text">idle</span></span>
    <select id="level" title="Your level">
      <option value="1">Beginner</option>
      <option value="2">Intermediate</option>
      <option value="3">Expert</option>
    </select>
  </div>
</div>

<script>
'use strict'
const COLOR = { think: '#a78bfa', plan: '#f472b6', search: '#38bdf8', read: '#60a5fa', edit: '#34d399', run: '#fbbf24',
  web: '#22d3ee', delegate: '#fb923c', tools: '#94a3b8', ask: '#f87171', talk: '#c084fc', done: '#4ade80', idle: '#64748b' }
const CONTROLS = ['b-why', 'b-tip', 'b-known', 'b-pause', 'level']
/** the mod's narratorModel setting, as the snapshot names it */
const NARRATOR = { haiku: 'Haiku', sonnet: 'Sonnet' }
const $ = id => document.getElementById(id)
const params = new URLSearchParams(location.search)
let wanted = params.get('sid') || ''
const KEY = params.get('key') || ''
const keyed = path => path + (path.includes('?') ? '&' : '?') + 'key=' + encodeURIComponent(KEY)
let snap = null
let lastSvg = ''
let source = null
let isLocked = false
let lastOptions = ''
let listedSids = new Set()
let listSoon = 0

// ---- a small, safe Markdown renderer (the subset Pairwatch writes) ----
const escHtml = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
function inline(raw) {
  // code spans first, so nothing inside them is touched
  const parts = []
  const re = /``([\s\S]+?)``|`([^`]+)`/g
  let last = 0, m
  while ((m = re.exec(raw))) {
    parts.push({ text: raw.slice(last, m.index) })
    parts.push({ code: m[1] !== undefined ? m[1].trim() : m[2] })
    last = re.lastIndex
  }
  parts.push({ text: raw.slice(last) })
  return parts.map(p => {
    if (p.code !== undefined) return `<code>${escHtml(p.code)}</code>`
    let s = p.text
    const keep = []
    s = s.replace(/\\([\\`*_[\]<>#|()!-])/g, (_, ch) => { keep.push(ch); return `\u0000${keep.length - 1}\u0000` })
    s = escHtml(s)
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, (_, t, u) => `<a href="${u}" target="_blank" rel="noopener noreferrer">${t}</a>`)
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    s = s.replace(/(^|[^\w*])\*([^*\n]+)\*(?=[^\w*]|$)/g, '$1<em>$2</em>')
    s = s.replace(/(^|[^\w])_([^_\n]+)_(?=[^\w]|$)/g, '$1<em>$2</em>')
    s = s.replace(/\u0000(\d+)\u0000/g, (_, i) => escHtml(keep[Number(i)]))
    return s
  }).join('')
}
function md(text) {
  if (!text) return ''
  const out = []
  for (const block of String(text).split(/\n{2,}/)) {
    const lines = block.split('\n')
    if (lines.every(l => /^>\s?/.test(l))) {
      out.push(`<blockquote>${md(lines.map(l => l.replace(/^>\s?/, '')).join('\n'))}</blockquote>`)
    } else if (lines.every(l => /^[-*]\s+/.test(l))) {
      out.push(`<ul>${lines.map(l => `<li>${inline(l.replace(/^[-*]\s+/, ''))}</li>`).join('')}</ul>`)
    } else {
      out.push(`<p>${lines.map(inline).join('<br>')}</p>`)
    }
  }
  return out.join('')
}

/** A home folder as ~: /home/<name> (Linux), /Users/<name> (macOS), /root, C:\Users\<name> (Windows). */
const tilde = path => String(path || '')
  .replace(/^\/(?:home|Users)\/[^/]+(?=\/|$)/, '~')
  .replace(/^\/root(?=\/|$)/, '~')
  .replace(/^[A-Za-z]:\\Users\\[^\\]+(?=\\|$)/i, '~')

// ---- drawing a snapshot ----
function show(el, html) {
  el.innerHTML = html
  el.classList.toggle('hidden', !html)
}
function setControls(isOn) {
  for (const id of CONTROLS) $(id).disabled = !isOn
}
/** Draws a session's snapshot; null (or one with no stage) is the waiting state. */
function render(s) {
  const has = !!(s && s.svg)
  snap = has ? s : null
  $('empty').classList.toggle('hidden', has)
  $('live').classList.toggle('hidden', !has)
  if (!has) {
    $('stage').innerHTML = ''
    lastSvg = ''
    setControls(false)
    $('chip-text').textContent = 'idle'
    $('meta').textContent = 'waiting for a session'
    return
  }
  const isEnded = s.ended === true
  const color = COLOR[s.station] || COLOR.idle
  document.documentElement.style.setProperty('--st', color)
  if (s.svg !== lastSvg) {
    // a new stage document: its animations start over, as they should for a new step
    $('stage').innerHTML = s.svg
    lastSvg = s.svg
  }
  $('stage').setAttribute('aria-label', s.alt || '')
  $('ended').classList.toggle('hidden', !isEnded)
  $('ended-next').textContent = !isEnded ? ''
    : wanted ? 'Pick another session above, or follow the newest.'
    : 'This page moves on to the next session as soon as one starts.'
  const narrator = typeof s.narrator === 'string' && Object.hasOwn(NARRATOR, s.narrator) ? NARRATOR[s.narrator] : 'Haiku'
  const src = s.narrationSource === 'model' ? `<span class="src">narrated by ${narrator}</span>` : ''
  $('now').innerHTML = src + md(s.head)
  show($('ask'), md(s.ask))
  show($('lesson'), md(s.lesson))
  $('context').innerHTML = [md(s.goal), md(s.recent)].filter(Boolean).join('')
  show($('note'), s.note ? escHtml(s.note) : '')
  $('b-pause').textContent = s.isPaused ? '▶ Resume' : '⏸ Pause'
  $('b-why').textContent = s.isAsking ? '🤔 Asking…' : '🤔 Why?'
  // an ended session's mod no longer listens: nothing to press
  setControls(!isEnded)
  $('b-why').disabled = isEnded || !!s.isAsking
  $('b-known').disabled = isEnded || !s.hasLesson
  if (document.activeElement !== $('level')) $('level').value = String(s.level || 1)
  $('chip-text').textContent = isEnded ? 'ended' : `${s.station || 'idle'} · ${s.status || ''}`
  tickMeta()
  // a session the picker does not know yet: list again soon (the server lists its folder once a second)
  if (!listedSids.has(s.sid) && !listSoon) listSoon = setTimeout(() => { listSoon = 0; loadSessions() }, 1200)
}
function ago(ms) {
  const s = Math.max(0, Math.round(ms / 1000))
  return s < 5 ? 'just now' : s < 60 ? `${s}s ago` : s < 3600 ? `${Math.round(s / 60)}m ago` : `${Math.round(s / 3600)}h ago`
}
function tickMeta() {
  if (!snap) return
  const where = tilde(snap.cwd)
  const when = `${snap.ended === true ? 'ended' : 'updated'} ${ago(Date.now() - (snap.at || Date.now()))}`
  $('meta').textContent = `${where}${where ? ' · ' : ''}${when}`
}
setInterval(tickMeta, 1000)

// ---- the key ----
function lock(isStale) {
  isLocked = true
  if (source) { source.close(); source = null }
  snap = null
  setControls(false)
  $('dot').classList.remove('live')
  $('meta').textContent = isStale ? 'the key no longer works' : 'no key'
  $('session').classList.add('hidden')
  $('live').classList.add('hidden')
  $('empty').classList.remove('hidden')
  $('empty').innerHTML = isStale
    ? '<h2>This link’s key no longer works</h2><p>Open the link that <code>/pairwatch</code> prints in Claude Code again: the page’s server has a new key.</p>'
    : '<h2>This page needs its key</h2><p>Open the link that <code>/pairwatch</code> prints in Claude Code: it ends in <code>?key=…</code>. The key keeps other people and other websites out of your session.</p>'
}

// ---- live connection: the server pushes the session this page follows ----
function connect() {
  if (isLocked) return
  if (source) source.close()
  const es = new EventSource(keyed('/api/events' + (wanted ? `?sid=${encodeURIComponent(wanted)}` : '')))
  source = es
  es.addEventListener('snapshot', e => {
    try { render(JSON.parse(e.data)) } catch (err) { console.warn('bad snapshot', err) }
  })
  es.addEventListener('empty', () => render(null))
  es.onopen = () => { $('dot').classList.add('live') }
  es.onerror = () => {
    if (source !== es) return
    $('dot').classList.remove('live')
    $('meta').textContent = 'reconnecting…'
    // the browser tries again by itself after a network error, but not after a refusal
    if (es.readyState === EventSource.CLOSED) recheck(es)
  }
}
async function recheck(es) {
  try {
    const res = await fetch(keyed('/api/sessions'))
    if (res.status === 403) return lock(true)
  } catch { /* the server is away */ }
  setTimeout(() => { if (source === es) connect() }, 3000)
}
async function loadSessions() {
  if (isLocked) return
  try {
    const res = await fetch(keyed('/api/sessions'))
    if (res.status === 403) return lock(true)
    const list = res.ok ? await res.json() : null
    if (!Array.isArray(list)) return
    listedSids = new Set(list.map(s => s.sid))
    const sel = $('session')
    const label = s => {
      const name = String(s.cwd || '').split(/[\\/]/).filter(Boolean).pop() || String(s.sid).slice(0, 8)
      const goal = String(s.goal || '').slice(0, 40)
      return `${name}${goal ? ` · ${goal}` : ''}${s.ended ? ' (ended)' : ''}`
    }
    const missing = wanted && !list.some(s => s.sid === wanted)
    const options = '<option value="">Newest session</option>' +
      (missing ? `<option value="${escHtml(wanted)}">${escHtml(wanted.slice(0, 8))}… (no longer listed)</option>` : '') +
      list.map(s => `<option value="${escHtml(String(s.sid))}">${escHtml(label(s))}</option>`).join('')
    // not while the person is choosing
    if (options !== lastOptions && document.activeElement !== sel) {
      sel.innerHTML = options
      lastOptions = options
      sel.value = wanted
    }
    // a choice between sessions: shown from two on, or while one is picked (to go back to the newest)
    sel.classList.toggle('hidden', list.length < 2 && !wanted)
  } catch { /* the server is restarting */ }
}
$('session').addEventListener('change', e => {
  wanted = e.target.value
  const q = new URLSearchParams({ key: KEY, ...(wanted ? { sid: wanted } : {}) })
  history.replaceState(null, '', `?${q}`)
  e.target.blur() // the keys w, t, k and p work again, and the list can refresh
  lastSvg = ''
  connect()
  loadSessions()
})

// ---- buttons: queued for the mod, which picks them up within a second ----
async function act(action, value, btn) {
  if (!snap || snap.ended === true) return
  if (btn) { btn.classList.add('flash'); setTimeout(() => btn.classList.remove('flash'), 600) }
  try {
    const res = await fetch('/api/action', { method: 'POST', headers: { 'content-type': 'application/json', 'x-pairwatch-key': KEY }, body: JSON.stringify({ sid: snap.sid, action, value }) })
    if (res.status === 403) lock(true)
  } catch { /* offline: the press is lost */ }
}
$('b-why').onclick = e => act('why', undefined, e.currentTarget)
$('b-tip').onclick = e => act('tip', undefined, e.currentTarget)
$('b-known').onclick = e => act('known', undefined, e.currentTarget)
$('b-pause').onclick = e => act('pause', undefined, e.currentTarget)
$('level').onchange = e => act('level', e.target.value)
document.addEventListener('keydown', e => {
  if (e.target instanceof HTMLSelectElement || e.metaKey || e.ctrlKey || e.altKey) return
  const key = { w: 'b-why', t: 'b-tip', k: 'b-known', p: 'b-pause' }[e.key]
  if (key) $(key).click()
})

setControls(false) // until a session shows
if (!KEY) {
  lock(false)
} else {
  connect()
  loadSessions()
  setInterval(loadSessions, 15000)
}
</script>
</body>
</html>
